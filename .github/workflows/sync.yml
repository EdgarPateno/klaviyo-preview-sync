name: Sync preview text

# Copies the hidden yellow preview block text of every Draft email campaign into its
# Klaviyo "Preview text" field. Template html is never written.
on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min, off the congested :00; runs can start a few minutes late
  workflow_dispatch:        # "Run workflow" button; also called every 2 min by cron-job.org (reliable trigger)

permissions:
  contents: read

concurrency:
  group: sync-preview-text
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore sync state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - name: Sync Draft campaigns
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
          SYNC_SEED_PER_RUN: "50"
          SYNC_ROTATE_PER_RUN: "25"  # every no-block draft re-checked within a few minutes
          SYNC_REDACT: "1"           # public repo: keep campaign names and copy out of the logs
          SYNC_TIME_BUDGET: "100"   # finish well inside the 2-minute external trigger interval
        run: |
          if [ -z "$KLAVIYO_API_KEY" ]; then
            echo "::error::Repo secret KLAVIYO_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          python3 sync_preview_text.py --all-drafts --apply

      - name: Save sync state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
